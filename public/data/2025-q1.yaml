  summary: Free, actively-developed deforestation-monitoring app; no retirement signal as of Q1 2025.
  rationale: 'ADOPT/E4 — diverges from 2026-Q4''s CAUTION/E4. The headline finding of this pass. GFW Pro launched publicly
    June 2019 and had, by January 2025, over 1,000 subscribing organisations, plus a newly-added EUDR compliance module (Aug
    2024) and a fresh TraceGains integration (Jan 2025) — WRI was actively expanding the product, not winding it down. The
    retirement/folding-into-Global-Nature-Watch announcement did not happen until September 2026, well after this quarter.
    A WALTER edition at 2025-Q1 had no basis to flag CAUTION — the honest call is ADOPT: widely-used, actively-developed,
    free default with real EUDR-readiness momentum.'
  actions:
  - Continue building EUDR due-diligence workflows on GFW Pro; note its January 2025 TraceGains integration as a new capability
    worth evaluating.
