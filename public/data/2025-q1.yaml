- id: conditions-palm-peat-conversion
  name: Palm-oil-driven peat and forest conversion
  quadrant: conditions
  ring: trial
  evidence: E4
  severity: medium
  scope:
    commodities:
    - palm-oil
    issues:
    - forests-land
    origins:
      political:
      - Indonesia
      - Malaysia
      ecological:
      - Borneo
      - Sumatra
      - Papua
    horizon:
    - now
  summary: Palm-oil deforestation trends are genuinely mixed since 2022 — no primary source newer than 2022 confirms direction.
  rationale: 'TRIAL/E4 (unchanged ring — with materially better, more current evidence than 2026-Q4''s write-up used). As
    of 2025-Q1, data existed through 2024 (31,314ha converted for industrial palm oil in 2024, a 9% decrease from 34,353ha
    in 2023 — Nusantara Atlas''s own analysis, published early 2025), plus Mongabay''s Feb 2024 report confirming a second
    consecutive annual increase (2022→2023). At 2025-Q1 the trend read as: rose in 2022/2023, then slowed slightly (not reversed)
    in 2024 — more current and nuanced than the 2026-Q4 researcher''s ''no primary source newer than 2022'' claim. TRIAL remains
    right either way.'
  actions:
  - Seek a 2024-2026 GFW or Trase data refresh before upgrading this blip's ring.
  - Monitor Papua specifically — the frontier where multiple sources agree expansion is accelerating.
  sources:
  - title: Palm oil deforestation makes comeback in Indonesia after decade-long slump
    url: https://news.mongabay.com/2024/02/palm-oil-deforestation-makes-comeback-in-indonesia-after-decade-long-slump/
    publisher: Mongabay
    type: secondary
