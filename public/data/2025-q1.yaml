- id: rules-eudr
  name: EU Deforestation Regulation (EUDR)
  quadrant: rules
  ring: adopt
  evidence: E5
  severity: null
  dominant_clock: political
  scope:
    commodities:
    - soy
    - cocoa
    - coffee
    - palm-oil
    - cattle
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: Applies from 30 Dec 2026 to large and medium operators; geolocation and due-diligence statements become a condition
    of EU market access.
  rationale: ADOPT/E5 (unchanged ring, materially different date). The Council formally adopted a one-year postponement in
    December 2024 (Reg. (EU) 2024/3234), so at 2025-Q1 EUDR applies from 30 December 2025 for large/medium operators — a full
    year earlier than 2026-Q4's 30 December 2026 date (reflecting a second delay agreed December 2025, after this quarter).
    The country benchmarking list (Impl. Reg. 2025/1093) had not yet been published — it came out 22 May 2025, in 2025-Q2
    — so rules-eudr-country-benchmark correctly has no 2025-Q1 entry.
  actions:
  - Confirm geolocation coverage per commodity × origin before 30 Dec 2026.
  - Map which suppliers and SKUs are hit by the 2027 scope additions.
  sources:
  - title: European Commission Proposes Further One-Year Delay to the EU Deforestation Regulation (background confirms Oct
      2024 first delay)
