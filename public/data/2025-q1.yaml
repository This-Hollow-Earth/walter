- id: conditions-cocoa-forest-loss
  name: Cocoa-driven forest loss and protected-area encroachment
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - cocoa
    issues:
    - forests-land
    - water
    origins:
      political:
      - Côte d'Ivoire
      - Ghana
      ecological:
      - Upper Guinean forests
    horizon:
    - now
    - '2030'
  summary: Cocoa drives documented protected-area loss in Côte d'Ivoire/Ghana, compounded by rising heat and drought stress.
  rationale: ADOPT/E4, unchanged. Peer-reviewed Kalischek et al. study (2023) documenting 37% of Côte d'Ivoire protected-area
    forest loss linked to cocoa was already available. USDA GAIN report dated 7 March 2025 — inside 2025-Q1 itself — puts
    ~12% of Ivorian cocoa producers inside protected forest, same figure as 2026-Q4. Genuinely stable, already-mature condition;
    S&P Global Sustainable1 drought-stress research not confirmed to predate 2025-Q1, excluded.
  actions:
  - Screen cocoa-sourcing landscapes in Côte d'Ivoire and Ghana against protected-area boundaries directly, not only national-level
    statistics.
  - Factor 2030-2050 drought-stress projections into long-horizon cocoa sourcing and pricing assumptions.
  sources:
  - title: Cocoa plantations are associated with deforestation in Côte d'Ivoire and Ghana's protected areas
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10208960/
    publisher: Environmental Research Letters (peer-reviewed, via PMC/NCBI)
    type: primary
    accessed: '2026-09-23'
  - title: Côte d'Ivoire – Cocoa Sector Overview – 2025
    url: https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Cote%20d%27Ivoire%20-%20Cocoa%20Sector%20Overview%20-%202025_Accra_Cote%20d%27Ivoire_IV2025-0001.pdf
    publisher: USDA Foreign Agricultural Service (GAIN report)
    type: primary
    accessed: '2026-09-23'
