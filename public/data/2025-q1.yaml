- id: conditions-water-stress-copper-lithium-basins
  name: Water stress in copper and lithium basins
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - copper
    - lithium
    issues:
    - water
    origins:
      political:
      - Chile
      - Argentina
      ecological:
      - Atacama
      - Salar basins
    horizon:
    - now
    - '2030'
  summary: Basin water demand in Atacama copper/lithium regions is outpacing resupply, per two peer-reviewed hydrological
    studies.
  rationale: ADOPT/E4, unchanged. The AGU peer-reviewed paper (2021) and the Observatorio Ciudadano/CELS/FIDH civil-society
    report both predate 2025-Q1. 2026-Q4's MDPI Water paper (19 Nov 2025) did not exist yet; in its place, a 2024 InSAR subsidence
    study (Castillo/Delgado, IEEE Trans. Geoscience and Remote Sensing, reported by Forbes Sept 2024) independently corroborates
    ongoing basin stress via satellite radar-measured land subsidence (1-2cm/year) — arguably a stronger corroborating data
    point for 2025-Q1.
  actions:
  - Screen copper and lithium sourcing basins for cumulative (not just extraction-attributed) water stress.
  - Pair basin screening (Aqueduct) with facility-level water-use disclosure before treating a supplier as low-risk.
  sources:
  - title: Relic Groundwater and Prolonged Drought Confound Interpretations of Water Sustainability and Lithium Extraction
      in Arid Lands
    url: https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2021EF002555
    publisher: AGU Earth's Future (peer-reviewed)
    type: primary
    accessed: '2026-09-24'
  - title: How Is One Of The Biggest Sources Of Lithium On Earth Sinking?
    url: https://forbes.com/sites/andrewwight/2024/09/12/how-is-one-of-the-biggest-sources-of-lithium-on-earth-sinking
    publisher: Forbes (reporting on Castillo/Delgado, Universidad de Chile, IEEE 2024)
    type: secondary
    accessed: '2026-09-24'
