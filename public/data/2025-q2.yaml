  rationale: 'DIFFERENT FROM 2026-Q4 — ADOPT/E4, not CAUTION/E4. The most important real change found in this pass. The retirement/consolidation
    announcement is dated to 2026: ''In June 2026, Global Forest Watch became Global Nature Watch... GFW Pro will retire on
