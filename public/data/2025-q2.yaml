  summary: Palm-oil deforestation trends are genuinely mixed since 2022 — no primary source newer than 2022 confirms direction.
  rationale: 'TRIAL/E4, unchanged, but thinner evidence base than 2026-Q4''s. Trase/SEI data through 2022 and Mongabay''s
    Feb 2024 reporting both available by Q2 2025. Real difference: the 2025 Gaveau/TheTreeMap remote-sensing analysis (Papua
    doubling) did not exist yet — that source is dated to 2025 data, published later in 2025 at the earliest. Describe the
    trend using only pre-2023 data: decade-long decline reversing as of 2022, direction uncertain beyond that.'
  actions:
  - Seek a 2024-2026 GFW or Trase data refresh before upgrading this blip's ring.
  - Monitor Papua specifically — the frontier where multiple sources agree expansion is accelerating.
  sources:
  - title: Indonesian palm oil exports and deforestation
