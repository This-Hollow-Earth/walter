- id: conditions-water-stress-copper-lithium-basins
  name: Water stress in copper and lithium basins
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - copper
    - lithium
    issues:
    - water
    origins:
      political:
      - Chile
      - Argentina
      ecological:
      - Atacama
      - Salar basins
    horizon:
    - now
    - '2030'
  summary: Basin water demand in Atacama copper/lithium regions is outpacing resupply, per two peer-reviewed hydrological
    studies.
  rationale: 'ADOPT/E4, High severity, unchanged. The AGU 2021/2022 paper available well before Q2 2025 remains the anchor.
    Real difference: 2026-Q4''s MDPI Water paper (Nov 2025) and Mongabay/Observatorio Ciudadano report (Sept 2025) did not
    exist yet — substituted a 2023 peer-reviewed review synthesising Marazuela et al. (2019), documenting groundwater drawdown
    up to 8m near SQM pumping stations, consistent with the same basin-cumulative-but-spatially-concentrated nuance.'
  actions:
  - Screen copper and lithium sourcing basins for cumulative (not just extraction-attributed) water stress.
  - Pair basin screening (Aqueduct) with facility-level water-use disclosure before treating a supplier as low-risk.
  sources:
  - title: Relic Groundwater and Prolonged Drought Confound Interpretations of Water Sustainability and Lithium Extraction
      in Arid Lands
