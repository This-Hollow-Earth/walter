- id: rules-eudr
  name: EU Deforestation Regulation (EUDR)
  quadrant: rules
  ring: adopt
  evidence: E5
  severity: null
  dominant_clock: political
  scope:
    commodities:
    - soy
    - cocoa
    - coffee
    - palm-oil
    - cattle
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: Applies from 30 Dec 2026 to large and medium operators; geolocation and due-diligence statements become a condition
    of EU market access.
  rationale: 'ADOPT/E5 — same ring, materially different facts. As of Q2 2025, EUDR is under its FIRST postponement only:
    Reg. (EU) 2024/3234 (23 Dec 2024) pushed application to 30 December 2025 (large/medium) and 30 June 2026 (micro/small).
    The country benchmarking list had just been published 22 May 2025. The SECOND postponement (Reg. (EU) 2025/2650, pushing
    to 30 Dec 2026) did not happen until December 2025, six months after this quarter. A 2025-Q2 edition must say ''applies
    30 Dec 2025,'' not ''30 Dec 2026'' — a full year earlier than 2026-Q4.'
  actions:
  - Confirm geolocation coverage per commodity × origin before 30 Dec 2026.
  - Map which suppliers and SKUs are hit by the 2027 scope additions.
  sources:
  - title: Regulation on deforestation-free products
    url: https://environment.ec.europa.eu/topics/forests/deforestation/regulation-deforestation-free-products_en
    publisher: European Commission
    type: primary
    accessed: '2026-09-23'
