- id: rules-eudr-country-benchmark
  name: EUDR country benchmark as primary risk input
  quadrant: rules
  ring: caution
  evidence: E3
  severity: null
  dominant_clock: political
  scope:
    commodities:
    - soy
    - cocoa
    - coffee
    - palm-oil
    - cattle
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: The EUDR country risk list is a compliance tier, not a risk assessment. It will not be updated before the EUDR
    applies.
  rationale: 'CAUTION/E3 — this is the blip''s first-appearance quarter (since: 2025-05-26), materially different from 2026-Q4''s
    E4/''won''t be revised'' framing. Commission Impl. Reg. (EU) 2025/1093 (22 May 2025) published the first-ever country
    classification — only 4 high risk, majority (Brazil, Indonesia, Côte d''Ivoire, etc.) standard, none low risk in this
    first list. Brand new at end of Q2 2025 — no track record yet of stability. The later developments hardening 2026-Q4''s
    framing (May 2026 ''won''t be updated'' statement; Parliament''s July 2025 rejection, one month after this quarter) are
    not yet known facts. CAUTION/E3 not E4: real instrument, genuine over-reliance risk, but too new for the ''no revision
    confirmed'' evidence.'
  actions:
  - Use the country tier only for the legal due-diligence level; screen risk at landscape or plot level.
  sources:
  - title: Implementing Regulation (EU) 2025/1093 (country classification)
    url: https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32025R1093
