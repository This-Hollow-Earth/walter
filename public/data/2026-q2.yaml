  summary: Major traders exited the Amazon Soy Moratorium in Jan 2026 while Cerrado soy-driven conversion keeps rising.
  rationale: ADOPT/E4, unchanged from Q1 into Q2. The Amazon Soy Moratorium exit (confirmed early Jan 2026) remains the anchoring
