  summary: Batteries Regulation due-diligence rules are stopped-clock delayed and the small-mid-cap threshold moved from €40m
    to €200m.
  rationale: 'Same ASSESS/E5 ring as 2026-Q4, but the small-mid-cap turnover threshold was still moving through most of Q2:
    Commission''s original proposal was €150m turnover, Parliament''s 20 Feb 2026 counter-proposal (feeding into Q2) pushed
    for €200m turnover/€172m assets/1,000 employees, and the provisional co-legislator agreement landing on those figures
    wasn''t reached until 8-9 June 2026 — the final days of Q2. A faithful Q2 edition should flag the threshold as still-negotiating,
    not settled.'
  actions:
  - Track the 23 Nov 2026 plenary vote before assuming the €200m threshold is final.
  - Flag battery-materials suppliers that would fall inside either the €40m or €200m threshold for early diligence.
