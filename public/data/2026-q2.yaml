- id: conditions-cocoa-forest-loss
  name: Cocoa-driven forest loss and protected-area encroachment
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - cocoa
    issues:
    - forests-land
    - water
    origins:
      political:
      - Côte d'Ivoire
      - Ghana
      ecological:
      - Upper Guinean forests
    horizon:
    - now
    - '2030'
  summary: Cocoa drives documented protected-area loss in Côte d'Ivoire/Ghana, compounded by rising heat and drought stress.
  rationale: ADOPT/E4, unchanged since 2025-Q1. Peer-reviewed protected-area study (37% of Ivorian protected-area forest loss
    linked to cocoa) and USDA's GAIN report (7 Mar 2025, ~12% of producers inside protected forest) meet the bar alone. S&P
    Global Sustainable1's 'Brewing risks' drought-stress report could not be independently dated in this pass and is dropped
    rather than assumed to predate Q2.
  actions:
  - Screen cocoa-sourcing landscapes in Côte d'Ivoire and Ghana against protected-area boundaries directly, not only national-level
    statistics.
  - Factor 2030-2050 drought-stress projections into long-horizon cocoa sourcing and pricing assumptions.
