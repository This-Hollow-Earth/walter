  summary: Applies from 30 Dec 2026 to large and medium operators; geolocation and due-diligence statements become a condition
    of EU market access.
  rationale: EUDR application dates locked (30 Dec 2026 large/medium, 30 Jun 2027 micro/small) confirmed unchanged through
    Q2 2026; the 4 May 2026 Commission simplification review (detailed at the 41st MSP meeting, 8 May 2026) confirmed the
    core text would not reopen. However, the Annex I product-scope delegated act (Delegated Reg. (EU) 2026/2102 — leather
    out, soluble coffee/palm-oil derivatives in) was still only a draft out for public feedback during Q2; it was not formally
    adopted until 13 July 2026 (Q3). A Q2 edition should not cite 2026/2102 as in force.
  actions:
  - Confirm geolocation coverage per commodity × origin before 30 Dec 2026.
  - Map which suppliers and SKUs are hit by the 2027 scope additions.
