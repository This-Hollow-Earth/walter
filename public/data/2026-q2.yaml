- id: intelligence-wri-aqueduct
  name: WRI Aqueduct 4.0
  quadrant: intelligence
  ring: adopt
  evidence: E4
  severity: null
  dominant_clock: natural
  scope:
    commodities:
    - copper
    - lithium
    - coffee
    - soy
    issues:
    - water
    origins:
      political: []
      ecological: []
    horizon:
    - now
    - '2030'
  uncertainty:
    spatial_resolution: sub-basin
    attribution_confidence: null
  summary: Free, sub-basin water-risk data with 2030 projections; the default starting point for basin screening.
  rationale: 'Aqueduct 4.0 gives baseline and projected water stress at sub-basin level, is free and openly licensed (CC BY
    4.0), and is already the reference in many corporate and investor water-risk methods. For a procurement lead that makes
    it the obvious first screen for sourcing basins, especially for copper and lithium in arid regions. It is a screen, not
