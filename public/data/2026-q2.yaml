  summary: Indirect cattle suppliers remain a documented traceability blind spot behind Amazon and Chaco deforestation.
  rationale: 'ADOPT/E4, unchanged since 2025-Q4. HRW/Al Jazeera''s Oct 2025 investigation (Brazil GTA-permit indirect-supplier
