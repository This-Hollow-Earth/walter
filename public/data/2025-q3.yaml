- id: rules-eudr-country-benchmark
  name: EUDR country benchmark as primary risk input
  quadrant: rules
  ring: caution
  evidence: E4
  severity: null
  dominant_clock: political
  scope:
    commodities: *id001
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
