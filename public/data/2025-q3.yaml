  summary: TNFD's LEAP approach is the de facto nature-risk assessment method, with over 1,000 organisations reporting TNFD-aligned.
  rationale: TNFD's LEAP (Locate, Evaluate, Assess, Prepare) approach provides a structured method for assessing nature-related
    dependencies, impacts, risks and opportunities. The TNFD's own 2026 Status Report counts over 1,000 organisations now
    reporting TNFD-aligned disclosures, making LEAP the closest thing to a de facto standard method in this space — ahead
