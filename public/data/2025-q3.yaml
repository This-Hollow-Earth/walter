- id: rules-eu-batteries-dd
  name: EU Batteries Regulation due diligence
  quadrant: rules
  ring: assess
  evidence: E5
  severity: null
  scope:
    commodities:
    - copper
    - lithium
    issues:
    - biodiversity
    - water
    horizon:
    - now
    - '2030'
  summary: Batteries Regulation due-diligence rules are stopped-clock delayed and the small-mid-cap threshold moved from
    €40m to €200m.
  rationale: 'The Council adopted a stop-the-clock law in mid-2025 postponing the Batteries Regulation''s due-diligence
    obligations (Reg. (EU) 2025/1561), and a subsequent small-mid-cap (SMC) agreement raised the exemption threshold from
    an originally-drafted €40m to €200m turnover, with an indicative European Parliament plenary vote on 23 November 2026.
    For a battery-materials buyer this is a genuine ASSESS: the direction (due diligence obligations for critical minerals
    in batteries) is settled policy intent, but the who/when is still moving and shouldn''t be built into 2026-2027 compliance
    plans yet.'
  actions:
  - Track the 23 Nov 2026 plenary vote before assuming the €200m threshold is final.
  - Flag battery-materials suppliers that would fall inside either the €40m or €200m threshold for early diligence.
  sources:
