  summary: Tools like Visipec and SeloVerde pilot indirect cattle-supplier traceability, but rollout is partial and data
    gaps persist.
  rationale: Real pilots and tools exist for tracing indirect cattle suppliers — Visipec, Trase's SeloVerde supply-shed
    risk mapping across 1,249 slaughterhouses, and GTFI audit guidelines. But Mongabay's late-2024 reporting and Trase's
    own analysis both stress persistent data gaps and no full-scale rollout across the Brazilian cattle sector. TRIAL, not
    ADOPT, reflects genuine pilot-stage tooling against a structurally hard problem (pairs directly with the indirect-supplier
    blind spot named in the cattle-deforestation condition blip).
  actions:
  - Pilot Visipec or an equivalent tool on your highest-volume Brazilian cattle suppliers before assuming coverage.
