- id: responses-certification-as-sole-dd-evidence
  name: Certification as sole EUDR due-diligence evidence
  quadrant: responses
  ring: caution
  evidence: E3
  severity: null
  scope:
    commodities: *id002
    issues:
    - forests-land
    horizon:
    - now
  summary: EC guidance confirms certification schemes can support, but never substitute for, EUDR due diligence.
  rationale: 'Two European Commission primary sources — the FAQ (v5, April 2026, §5.7) and the 2026 Guidance Document''s
    Section 10 — directly and unambiguously confirm that certification and verification schemes "can be used ... to help
    their risk assessment," but operators "will still be required to exercise due diligence, and they will remain responsible
    for any breach." This closes off a real temptation: treating a certification stamp as a compliance shortcut. CAUTION/E3
    reflects a well-supported, settled regulatory position — not a shifting or uncertain one.'
  actions:
  - Do not present certification alone as sufficient EUDR due-diligence evidence in supplier communications or internal
    sign-off.
  - Use certification as one input into, not a substitute for, plot-level due diligence.
  sources:
  - title: Frequently Asked Questions — Implementation of the EU Deforestation Regulation, Version 5
    url: https://environment.ec.europa.eu/document/download/744919a7-8650-4850-89ad-a597268cd69e_en?filename=FAQ-UPDATE-5th-Iteration%20FINAL.pdf
