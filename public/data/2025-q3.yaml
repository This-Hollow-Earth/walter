  summary: CSDDD survives Omnibus I with a narrower scope (>5,000 employees / €1.5bn turnover) and a 2029 application date.
  rationale: 'The CSDDD/CSRD Omnibus package was published in the Official Journal in early 2026, narrowing CSDDD''s scope
    to companies above 5,000 employees and €1.5bn turnover and pushing first application to 26 July 2029. Transposition,
    delegated acts and Commission guidelines are still being worked out through 2026-2027 consultations. For most mid-sized
    operators this moves CSDDD out of urgent planning and into a watch item: the substantive due-diligence obligations are
    real and coming, but the compressed scope and multi-year runway mean it does not yet justify the operational attention
    EUDR does.'
