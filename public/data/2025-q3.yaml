  summary: Applies from 30 Dec 2026 to large and medium operators; geolocation and due-diligence statements become a condition
    of EU market access.
  rationale: 'After two postponements and a 2026 simplification review that left the core text intact, the EUDR applies
    to large and medium operators from 30 December 2026 and to other micro and small operators from 30 June 2027. For a
    procurement lead sourcing soy, cocoa, coffee, palm oil or cattle into the EU, this is no longer a scenario but an operating
    condition: plot-level geolocation and due-diligence statements are table stakes. Scope keeps moving at the edges. Delegated
    Regulation (EU) 2026/2102 removes leather and hides, and adds soluble coffee, some palm-oil derivatives and frozen cattle
    tongues from 30 December 2027. Treat those as a watch item, not a reason to wait.'
  actions:
  - Confirm geolocation coverage per commodity × origin before 30 Dec 2026.
  - Map which suppliers and SKUs are hit by the 2027 scope additions.
  sources:
