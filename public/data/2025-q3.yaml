- id: rules-eu-batteries-dd
  name: EU Batteries Regulation due diligence
  quadrant: rules
  ring: assess
  evidence: E5
  severity: null
  scope:
    commodities:
    - copper
    - lithium
    issues:
    - biodiversity
    - water
    horizon:
    - now
    - '2030'
  summary: Batteries Regulation due-diligence rules are stopped-clock delayed and the small-mid-cap threshold moved from €40m
    to €200m.
  rationale: ASSESS/E5 — real difference (first appearance this quarter, threshold story not yet part of it). Council adopted
    the 'stop-the-clock' regulation 18 July 2025, published in OJ 30 July 2025, postponing due-diligence to 18 August 2027.
    The €40m→€200m SMC threshold move that 2026-Q4 leans on did not exist yet — that agreement dates to June 2026, nearly
    a year later. The clock stopped, the postponement is real and primary-sourced, but the eventual scope/threshold was still
    fully open — do not backdate the €200m threshold.
  actions:
  - Track the 23 Nov 2026 plenary vote before assuming the €200m threshold is final.
  - Flag battery-materials suppliers that would fall inside either the €40m or €200m threshold for early diligence.
  sources:
  - title: Simplification — Council adopts law to stop the clock on due diligence rules for batteries
    url: https://www.consilium.europa.eu/en/press/press-releases/2025/07/18/simplification-council-adopts-law-to-stop-the-clock-on-due-diligence-rules-for-batteries/
    publisher: Council of the EU
    type: primary
    accessed: '2026-09-23'
