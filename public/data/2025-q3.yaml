    and USDA''s 2025 GAIN report puts 12% of Ivorian cocoa producers inside protected forest land. S&P Global Sustainable1''s
    climate research separately projects up to 65% of Ghana''s cocoa belt under drought stress by 2050. This blip merges
    what were two related longlist items (forest encroachment and climate/heat stress) because they share the same producer
    base and compounding drivers: land pressure pushes cultivation into forest margins just as climate stress reduces suitable
    land elsewhere. ADOPT reflects that this is an active, well-documented, structural condition for West African cocoa
    sourcing.'
  actions:
  - Screen cocoa-sourcing landscapes in Côte d'Ivoire and Ghana against protected-area boundaries directly, not only national-level
    statistics.
  - Factor 2030-2050 drought-stress projections into long-horizon cocoa sourcing and pricing assumptions.
