- id: conditions-soy-frontier-conversion
  name: Forest & savanna conversion on the soy frontier
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - soy
    issues:
    - forests-land
    origins:
      political:
      - Brazil
      ecological:
      - Cerrado
      - Amazon
    horizon:
    - now
  summary: Major traders exited the Amazon Soy Moratorium in Jan 2026 while Cerrado soy-driven conversion keeps rising.
  rationale: 'Reuters and AP confirmed in January 2026 that major Brazilian grain traders quit the Amazon Soy Moratorium,
    with roughly two-thirds of former signatories gone. Trase''s dataset shows Cerrado soy-linked conversion rising — 794,000
    ha in 2022, up from 635,000 ha in 2020 — predating the moratorium exit and suggesting the trend was already unfavourable.
    For a soy buyer this is squarely ADOPT: forest and savanna conversion on the soy frontier is an active, worsening, well-documented
    condition, not an emerging risk. The moratorium''s collapse removes one of the few voluntary safeguards that existed
    against Amazon (though not Cerrado) conversion specifically.'
  actions:
  - Do not assume Amazon Soy Moratorium coverage still applies to all major traders; verify current signatory status per
    supplier.
  - Extend monitoring to the Cerrado, which the moratorium never covered and where conversion is rising fastest.
  sources:
