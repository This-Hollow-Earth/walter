- id: rules-eudr-country-benchmark
  name: EUDR country benchmark as primary risk input
  quadrant: rules
  ring: caution
  evidence: E4
  severity: null
  dominant_clock: political
  scope:
    commodities:
    - soy
    - cocoa
    - coffee
    - palm-oil
    - cattle
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: The EUDR country risk list is a compliance tier, not a risk assessment. It will not be updated before the EUDR
    applies.
  rationale: 'CAUTION/E4, unchanged in substance from 2026-Q4. Impl. Reg. (EU) 2025/1093 (23 May 2025) classes only 4 countries
    high risk, everything else including Brazil/Indonesia as ''standard'' — already fully in force through Q3 2025. Difference:
    2026-Q4''s rationale cites an 8 May 2026 Commission statement (''won''t be updated before EUDR application'') that did
    not exist yet in Q3 2025 — this quarter''s rationale should rest on the classification''s structural limits alone, not
    on a forward-looking commitment that hadn''t been made.'
  actions:
  - Use the country tier only for the legal due-diligence level; screen risk at landscape or plot level.
