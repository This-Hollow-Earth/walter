  summary: The EUDR country risk list is a compliance tier, not a risk assessment. It will not be updated before the EUDR
    applies.
  rationale: Implementing Regulation (EU) 2025/1093 classes only four countries as high risk and most producing countries
    (e.g. Brazil, Indonesia, Côte d'Ivoire) as standard. The Commission has said the list will not be updated before the
    EUDR applies on 30 December 2026. The tier decides how much due diligence the law requires. It says nothing about the
    deforestation or conversion risk in a specific landscape or supply shed. Using it as the main risk signal hides the
    subnational differences that decide real exposure.
  actions:
  - Use the country tier only for the legal due-diligence level; screen risk at landscape or plot level.
