  summary: Climate-suitability scenario modelling for coffee sourcing is scientifically strong but not yet an operational
    decision tool at scale.
  rationale: Peer-reviewed modelling (PLOS ONE, Journal of the Science of Food and Agriculture) and bank market commentary
    (RaboResearch) provide strong scientific grounding for using climate-suitability scenarios in coffee sourcing decisions.
