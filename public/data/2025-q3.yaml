- id: conditions-cocoa-forest-loss
  name: Cocoa-driven forest loss and protected-area encroachment
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - cocoa
    issues:
    - forests-land
    - water
    origins:
      political:
      - Côte d'Ivoire
      - Ghana
      ecological:
      - Upper Guinean forests
    horizon:
    - now
    - '2030'
  summary: Cocoa drives documented protected-area loss in Côte d'Ivoire/Ghana, compounded by rising heat and drought stress.
  rationale: 'ADOPT/E4, unchanged, with one dropped source. The peer-reviewed study (37% of Ivorian protected-area forest
    loss linked to cocoa) predates the window; USDA''s GAIN Côte d''Ivoire report (7 March 2025) is inside the pre-Q3 window
    and still current. Dropped: 2026-Q4''s S&P Global Sustainable1 drought-stress source has no confirmable publication date;
    the heat/drought-stress framing should be treated as a 2026-Q4-only addition until dated. Two primary sources still clear
    the ADOPT/E3+ bar on their own.'
  actions:
  - Screen cocoa-sourcing landscapes in Côte d'Ivoire and Ghana against protected-area boundaries directly, not only national-level
    statistics.
  - Factor 2030-2050 drought-stress projections into long-horizon cocoa sourcing and pricing assumptions.
  sources:
  - title: Cocoa plantations are associated with deforestation in Côte d'Ivoire and Ghana's protected areas
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10208960/
    publisher: Environmental Research Letters (peer-reviewed, via PMC/NCBI)
    type: primary
    accessed: '2026-09-23'
