- id: conditions-water-stress-copper-lithium-basins
  name: Water stress in copper and lithium basins
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - copper
    - lithium
    issues:
    - water
    origins:
