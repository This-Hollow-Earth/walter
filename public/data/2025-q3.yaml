      - China
      ecological:
      - Cerrado
      - Amazon
    horizon:
    - now
  summary: A China-Brazil soy sustainability guide reportedly leans on Brazilian legality, which is weaker than deforestation-free.
  rationale: 'Brazilian soy-sector reporting (Aprosoja-MT, Valor International) and a WRI China release describe new China-Brazil
    soy sustainability guidelines that reference Brazilian environmental law as a basis for recognition. The underlying
    guideline text itself was not retrieved directly — evidence here is secondary and from an interested party (Aprosoja,
    the Mato Grosso soy growers'' association) corroborated by an independent publisher (Valor) and WRI China''s own release
    framing. "Legality" and "deforestation-free" are not the same bar: Brazilian law still permits legal deforestation on
    private land under certain conditions. Treat any legality-only benchmark as CAUTION until the guideline text itself
    is verified.'
  actions:
  - Do not treat legality-only compliance as equivalent to a deforestation-free claim in supplier communications.
  - Seek the primary guideline text before citing it as a sourcing benchmark.
