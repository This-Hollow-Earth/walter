- id: rules-esrs-2026-e3-e4
  name: 'ESRS (2026): E3 Water & E4 Biodiversity'
  quadrant: rules
  ring: adopt
  evidence: E5
  severity: null
  scope:
    commodities: []
    issues:
    - biodiversity
    - water
    horizon:
    - now
  summary: ESRS's 2026 revision keeps biodiversity (E4) materiality statements mandatory even where full topical disclosure
    is phased in.
  rationale: 'The Commission''s July 2026 revision of the sustainability reporting standards (Reg. (EU) 2026/1563) and the
    Omnibus I CSRD scope amendment (Dir. (EU) 2026/470) cut disclosure volume and narrowed who reports, but did not remove
    the substance of ESRS 2''s biodiversity requirement. E4 (Biodiversity & Ecosystems) can be phased in on timing, but
    a biodiversity materiality statement is always required under ESRS 1 §§121-127, and any topic a company judges material
    still needs short disclosures from year one under ESRS 2 BP-2 §§7-10. For a sustainability lead this means: don''t read
    "simplification" as "biodiversity is optional" — the materiality assessment itself is the non-negotiable, and it decides
    what else follows.'
  actions:
  - Run (or re-run) the E4 double-materiality assessment now — it is required regardless of phase-in status.
  - Confirm which entities fall inside the narrowed CSRD scope after Omnibus I before scoping the disclosure.
  sources:
