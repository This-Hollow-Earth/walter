    - '2030'
  summary: Basin water demand in Atacama copper/lithium regions is outpacing resupply, per two peer-reviewed hydrological
    studies.
  rationale: 'ADOPT/E4, unchanged, but the 2026-Q4 MDPI source is period-inapplicable. The AGU 2021 paper holds throughout
    and alone clears the ADOPT/E4 bar. 2026-Q4''s MDPI Water paper was published 19 November 2025 — postdates this quarter,
    cannot be cited for Q3 2025. Euractiv''s reporting (SQM data: ~600,000L freshwater per tonne lithium carbonate, <10% of
    basin freshwater use lithium-attributed) corroborates the basin-cumulative framing.'
  actions:
  - Screen copper and lithium sourcing basins for cumulative (not just extraction-attributed) water stress.
  - Pair basin screening (Aqueduct) with facility-level water-use disclosure before treating a supplier as low-risk.
  sources:
  - title: Relic Groundwater and Prolonged Drought Confound Interpretations of Water Sustainability and Lithium Extraction
