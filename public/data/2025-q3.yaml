- id: conditions-cattle-deforestation
  name: Cattle-driven deforestation
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - cattle
    issues:
    - forests-land
    origins:
      political:
      - Brazil
      - Paraguay
      ecological:
      - Amazon
      - Gran Chaco
    horizon:
    - now
  summary: Indirect cattle suppliers remain a documented traceability blind spot behind Amazon and Chaco deforestation.
  rationale: 'Human Rights Watch''s October 2025 investigation (reported by Al Jazeera) documents that Brazil''s GTA cattle-movement
    permit system cannot trace indirect suppliers — individual animal traceability isn''t mandatory until 2032 — letting
    deforestation-linked cattle enter supply chains via intermediary ranches. In parallel, NASA/Landsat data and Earthsight''s
    "Grand Theft Chaco" investigation quantify large-scale, ongoing clearing (200,000-300,000 ha/year) in Paraguay''s Gran
    Chaco, heavily cattle-driven. This is ADOPT: well-evidenced, active, and structurally hard to fix because the blind
    spot is systemic (permit design), not a data-availability gap.'
  actions:
  - Treat indirect cattle suppliers as a default risk category, not an exception, until individual traceability is mandatory
    (2032).
  - Extend monitoring into the Paraguayan/Bolivian Chaco, not only the Brazilian Amazon.
  sources:
  - title: Is your beef linked to Amazon deforestation? A report highlights loopholes
    url: https://www.aljazeera.com/news/2025/10/15/is-your-beef-linked-to-amazon-deforestation-a-report-highlights-loopholes
