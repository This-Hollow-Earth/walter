- id: rules-eudr
  name: EU Deforestation Regulation (EUDR)
  quadrant: rules
  ring: adopt
  evidence: E5
  severity: null
  dominant_clock: political
  scope:
    commodities:
    - soy
    - cocoa
    - coffee
    - palm-oil
    - cattle
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: Applies from 30 Dec 2026 to large and medium operators; geolocation and due-diligence statements become a condition
    of EU market access.
  rationale: ADOPT/E5 — real difference from 2026-Q4. As of 30 Sept 2025, the operative application date was still 30 Dec
    2025 (the FIRST postponement), not 30 Dec 2026 — the second delay (Reg. (EU) 2025/2650) was only published Dec 2025, after
    this quarter closes. What existed by end-Q3 2025 was the Commission's 23 Sept 2025 announcement that it intended to propose
    a further one-year delay — a live signal, not yet law. Say 'applies from 30 Dec 2025, with a proposed but not-yet-enacted
    further delay,' not the 2026-Q4 phrasing assuming the second delay already happened.
  actions:
  - Confirm geolocation coverage per commodity × origin before 30 Dec 2026.
  - Map which suppliers and SKUs are hit by the 2027 scope additions.
  sources:
