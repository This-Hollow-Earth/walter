  summary: Applies from 30 Dec 2026 to large and medium operators; geolocation and due-diligence statements become a condition
    of EU market access.
  rationale: 'ADOPT/E5 unchanged ring, but the honest in-quarter story differs materially. For most of Q4 2025 (through late
    Dec) the EC had explicitly confirmed maintaining the original 30 Dec 2025 application date (per Latham & Watkins, 22 Oct
    2025) — days away, not a year away. Only in the final week did Parliament/Council agree a second postponement: political
    agreement 4 Dec 2025, Reg. (EU) 2025/2650 published 23 Dec 2025, resetting to 30 Dec 2026/30 Jun 2027. A procurement lead
    spent 11 of 13 weeks under an imminent deadline that only lifted in the quarter''s final week.'
  actions:
  - Confirm geolocation coverage per commodity × origin before 30 Dec 2026.
  - Map which suppliers and SKUs are hit by the 2027 scope additions.
  sources:
