- id: conditions-arabica-climate-suitability
  name: Shifting climate suitability for arabica coffee (to 2030)
  quadrant: conditions
  ring: assess
  evidence: E3
  severity: high
  scope:
    commodities:
    - coffee
    issues:
    - water
    origins:
      political:
      - Brazil
      ecological: []
    horizon:
    - now
    - '2030'
  summary: Climate change is projected to make roughly half of current arabica land unsuitable by 2050, with 2025-26 price
    volatility already visible.
  rationale: 'ASSESS/E3 — this is the blip''s founding-event quarter (lifecycle.since: 2025-10-01). Arabica hit a then-record
    $4.3795/lb in October 2025, driven by ~110,000 wildfires across Brazilian coffee regions plus a prolonged Vietnam drought,
    and a new US tariff on Brazilian coffee stacking on the drought (LA Times, 23 Oct 2025) — pushing prices up nearly 40%
    since August 2025. A genuine Q4 2025 edition could only report the peak as it was happening, with no visibility into the
    June 2026 crash that followed eight months later.'
  actions:
  - Brief sourcing and finance teams on 2030-2050 arabica suitability shifts before locking long-term contracts.
  - Track short-term price volatility as an early indicator of the modelled long-term suitability shift.
  sources:
  - title: Coffee Price Forecast — Expert Analysis and Market Predictions
    url: https://j2t.com/solutions/blogview/coffee-price-forecast/
    publisher: Just2Trade
    type: secondary
    accessed: '2026-09-24'
