    url: https://www.latimes.com/business/story/2025-10-23/expect-to-keep-paying-record-prices-for-coffee-this-is-why
    publisher: Los Angeles Times
    type: secondary
    accessed: '2026-09-24'
  - title: Projected Shifts in Coffea arabica Suitability (Bunn et al., 2015)
