- id: rules-eu-batteries-dd
  name: EU Batteries Regulation due diligence
  quadrant: rules
  ring: assess
  evidence: E5
  severity: null
  scope:
    commodities:
    - copper
    - lithium
    issues:
    - biodiversity
    - water
    horizon:
    - now
    - '2030'
  summary: Batteries Regulation due-diligence rules are stopped-clock delayed and the small-mid-cap threshold moved from €40m
    to €200m.
  rationale: 'ASSESS/E5 unchanged ring. At Q4 2025 the story is simple and singular: Reg. (EU) 2025/1561 (30 Jul 2025) postpones
    battery due-diligence obligations by two years to 18 Aug 2027. No SMC threshold negotiation exists yet — the €40m→€200m
    exemption-threshold agreement (8 Jun 2026) and 23 Nov 2026 plenary vote both postdate this quarter by six-plus months.
    Describe a clean two-year delay, not a live threshold fight.'
  actions:
  - Track the 23 Nov 2026 plenary vote before assuming the €200m threshold is final.
  - Flag battery-materials suppliers that would fall inside either the €40m or €200m threshold for early diligence.
  sources:
