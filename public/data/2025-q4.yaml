  summary: Free, widely-adopted deforestation-monitoring app; no retirement signal as of Q4 2025.
  rationale: ADOPT/E4 — differs from 2026-Q4 (currently CAUTION). GFW Pro's rebrand into Global Nature Watch and its 31 Dec
    2026 retirement announcement both happened in June 2026 — 6-8 months after Q4 2025. A January 2025 TraceGains partnership
    press release cites 'more than 1,000 organizations globally' using GFW Pro; Peru's MIDAGRI signed a June 2025 MOU with
    WRI for free, unlimited GFW Pro access to support EUDR compliance. No retirement/consolidation signal exists in the Q4-2025-dated
    record — treating this blip as CAUTION in a Q4 2025 edition would be an anachronism.
  actions:
  - Adopt GFW Pro as the default free monitoring tool for EUDR-relevant supply sheds; no migration planning warranted yet
    in Q4 2025.
  sources:
  - title: TraceGains Partners with Global Forest Watch Pro to Strengthen ESG Efforts Ahead of EU Deforestation Regulations
