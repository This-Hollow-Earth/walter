- id: rules-eudr-country-benchmark
  name: EUDR country benchmark as primary risk input
  quadrant: rules
  ring: caution
  evidence: E4
  severity: null
  dominant_clock: political
  scope:
    commodities:
    - soy
    - cocoa
    - coffee
    - palm-oil
    - cattle
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: The EUDR country risk list is a compliance tier, not a risk assessment. It will not be updated before the EUDR
    applies.
  rationale: CAUTION/E4 unchanged, largely unchanged in substance but the political controversy is fresher/more salient. Commission
    adopted the first country list (4 high-risk, ~50 standard, ~140 low) via Impl. Reg. 2025/1093 on 22 May 2025. On 9 July
    2025 Parliament voted 373-289 (non-binding) to object to the methodology; Preferred by Nature confirms the resolution
    doesn't repeal/annul the regulation. By Q4 2025 the list has been contested for a full quarter but remains unrevised and
    in force — strengthening rather than weakening the CAUTION case.
  actions:
  - Use the country tier only for the legal due-diligence level; screen risk at landscape or plot level.
