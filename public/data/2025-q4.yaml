- id: conditions-cattle-deforestation
  name: Cattle-driven deforestation
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - cattle
    issues:
    - forests-land
    origins:
      political:
      - Brazil
      - Paraguay
      ecological:
      - Amazon
      - Gran Chaco
    horizon:
    - now
  summary: Indirect cattle suppliers remain a documented traceability blind spot behind Amazon and Chaco deforestation.
  rationale: 'ADOPT/E4 — this is the blip''s founding-event quarter (lifecycle.since: 2025-10-15). HRW''s own ''Tainted''
    report documents that JBS''s Pará slaughterhouses couldn''t rule out sourcing from illegally deforested ranches, and that
    JBS pledged to require indirect-supplier declarations by January 2026 — unfulfilled as of Q4 2025. The indirect-cattle-supplier
    blind spot moved from a structural gap to a named, single-company case study this exact quarter.'
  actions:
  - Treat indirect cattle suppliers as a default risk category, not an exception, until individual traceability is mandatory
    (2032).
  - Extend monitoring into the Paraguayan/Bolivian Chaco, not only the Brazilian Amazon.
  sources:
  - title: 'Tainted: JBS and the EU''s Exposure to Human Rights Violations and Illegal Deforestation-Linked Cattle in Brazil'
    url: https://www.hrw.org/report/2025/10/15/tainted/jbs-and-the-eus-exposure-to-human-rights-violations-and-illegal
    publisher: Human Rights Watch
    type: primary
    accessed: '2026-09-24'
