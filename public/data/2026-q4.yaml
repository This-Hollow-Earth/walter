- id: rules-eudr-country-benchmark
  name: EUDR country benchmark as primary risk input
  quadrant: rules
  ring: caution
  movement: new
  previous_ring: null
  evidence: E4
  severity: null
  dominant_clock: political
  scope:
    commodities: *id001
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: The EUDR country risk list is a compliance tier, not a risk assessment. It will not be updated before
    the EUDR applies.
  rationale: Implementing Regulation (EU) 2025/1093 classes only four countries as high risk and most producing
    countries (e.g. Brazil, Indonesia, Côte d'Ivoire) as standard. The Commission has said the list will not be
    updated before the EUDR applies on 30 December 2026. The tier decides how much due diligence the law requires.
    It says nothing about the deforestation or conversion risk in a specific landscape or supply shed. Using it
    as the main risk signal hides the subnational differences that decide real exposure.
  actions:
  - Use the country tier only for the legal due-diligence level; screen risk at landscape or plot level.
  sources:
  - title: Implementing Regulation (EU) 2025/1093 (country classification)
    url: https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32025R1093
    publisher: EUR-Lex
    type: primary
    accessed: '2026-09-23'
  - title: Multi-Stakeholder Platform on Deforestation, 41st meeting summary (8 May 2026)
    url: https://ec.europa.eu/transparency/expert-groups-register/core/api/front/document/135985/download
    publisher: European Commission
    type: primary
    accessed: '2026-09-23'
  - title: EUDR simplification review, COM(2026)191
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52026DC0191
    publisher: European Commission
    type: primary
    accessed: '2026-09-23'
