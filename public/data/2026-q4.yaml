  summary: WRI's successor platform to GFW Pro; GNW Horizon is free and in preview, with EUDR dashboards announced.
  rationale: 'Global Nature Watch is where GFW Pro users are being moved. GNW Horizon is free and in preview, and
    EUDR and AFi dashboards have been announced but are not yet proven in operational due diligence. It is worth
    a structured look now, because the switch is forced by the end of 2026, but it has not earned TRIAL yet: capabilities
    and continuity for existing GFW Pro workflows still need to be confirmed.'
