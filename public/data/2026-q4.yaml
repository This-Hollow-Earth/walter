- id: intelligence-gfw-pro
  name: GFW Pro
  quadrant: intelligence
  ring: caution
  movement: new
  previous_ring: null
  evidence: E4
  severity: null
  dominant_clock: business
  scope:
    commodities: *id001
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: WRI's free deforestation-monitoring app retires on 31 Dec 2026, the day after the EUDR applies.
  rationale: 'GFW Pro has been a widely used free tool for monitoring deforestation in supply sheds and portfolios.
    WRI will retire the web app and API on 31 December 2026 and fold it into Global Nature Watch. Any EUDR due-diligence
    workflow that depends on it needs a migration plan now, because the retirement lands one day after the regulation
    applies to large and medium operators. That is why it sits in CAUTION: the tool is not wrong, but relying on
    it past 2026 is.'
  actions:
  - Inventory EUDR workflows and reports that depend on GFW Pro; plan the migration in Q4 2026.
  sources:
  - title: GFW Pro
    url: https://pro.globalforestwatch.org/
    publisher: World Resources Institute
    type: primary
    accessed: '2026-09-23'
  - title: About GFW Pro
    url: https://pro.globalforestwatch.org/about
    publisher: World Resources Institute
    type: primary
    accessed: '2026-09-23'
  related:
