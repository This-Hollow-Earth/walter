- id: rules-csddd
  name: CSDDD after Omnibus I
  quadrant: rules
  ring: assess
  evidence: E4
  severity: null
  scope:
    commodities: []
    issues:
    - forests-land
    - biodiversity
    - water
    horizon:
    - now
    - '2030'
  summary: CSDDD survives Omnibus I with a narrower scope (>5,000 employees / €1.5bn turnover) and a 2029 application date.
  rationale: ASSESS/E4 — event happens inside the quarter, so evidence is thinner than 2026-Q4's E5. Directive (EU) 2026/470
    (Omnibus I amending directive) was published in the OJ on 26 February 2026 and entered into force 18 March 2026 — both
    inside Q1 2026. A Q1 2026 edition would be reporting breaking, weeks-old news (>5,000 employee/€1.5bn turnover threshold,
    single 26 Jul 2029 application date) rather than settled, months-old fact. E4 not E5 because operational interpretation
    was still forming.
  actions:
  - Confirm whether your entity now falls inside or outside the narrowed >5,000 employee / €1.5bn threshold.
  - Track the Commission's CSDDD guidelines consultation for signals on what due diligence will concretely require.
