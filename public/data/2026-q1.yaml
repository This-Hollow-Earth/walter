- id: rules-eudr-country-benchmark
  name: EUDR country benchmark as primary risk input
  quadrant: rules
  ring: caution
  evidence: E3
  severity: null
  dominant_clock: political
  scope:
    commodities:
    - soy
    - cocoa
    - coffee
    - palm-oil
    - cattle
    issues:
    - forests-land
    origins:
      political: []
      ecological: []
    horizon:
    - now
  summary: The EUDR country risk list is a compliance tier, not a risk assessment. It will not be updated before the EUDR
    applies.
  rationale: 'CAUTION/E3 — same ring as 2026-Q4, but weaker evidentiary basis. The country list (Reg. 2025/1093: 4 high-risk,
    ~50 standard, ~140 low) was adopted 22 May 2025 and remained in force through Q1 2026. But the Commission''s 8 May 2026
    Multi-Stakeholder Platform ''no update before EUDR applies'' confirmation and the 4 May 2026 Guidance Document 3rd edition
    — both cited in 2026-Q4 — had not happened yet in Q1 2026. The strongest available Q1 evidence is Parliament''s July 2025
    non-binding rejection resolution plus the Commission''s 27 Oct 2025 written reply and eight months of no revision. E3,
    not E4, because the specific ''no update planned'' confirmation had not been made.'
  actions:
  - Use the country tier only for the legal due-diligence level; screen risk at landscape or plot level.
  sources:
