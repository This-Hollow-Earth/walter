- id: conditions-arabica-climate-suitability
  name: Shifting climate suitability for arabica coffee (to 2030)
  quadrant: conditions
  ring: assess
  evidence: E3
  severity: high
  scope:
    commodities:
    - coffee
    issues:
    - water
    origins:
      political:
      - Brazil
      ecological: []
    horizon:
    - now
    - '2030'
  summary: Climate change is projected to make roughly half of current arabica land unsuitable by 2050, with 2025-26 price
    volatility already visible.
  rationale: ASSESS/E3, unchanged — and the price-volatility evidence is if anything more current for Q1 2026 than for 2026-Q4.
    The record-price run continued into January 2026 (Brazil's Minas Gerais reporting well-below-average rainfall driving
    a fresh multi-week high) — a live, ongoing Q1 2026 event rather than a June 2026 crash the edition couldn't yet know about.
  actions:
  - Brief sourcing and finance teams on 2030-2050 arabica suitability shifts before locking long-term contracts.
  - Track short-term price volatility as an early indicator of the modelled long-term suitability shift.
  sources:
  - title: Projected Shifts in Coffea arabica Suitability among Major Global Producing Regions Due to Climate Change (Bunn
      et al., 2015)
