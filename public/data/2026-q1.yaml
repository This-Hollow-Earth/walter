  summary: Applies from 30 Dec 2026 to large and medium operators; geolocation and due-diligence statements become a condition
    of EU market access.
  rationale: 'ADOPT/E5, unchanged ring. Reg. (EU) 2025/2650 (in force 26 Dec 2025) had locked the second delay: application
    30 Dec 2026 (large/medium), 30 Jun 2027 (micro/small) — settled throughout Q1 2026, identical dates to 2026-Q4. The 13
    Jul 2026 scope amendment (Delegated Reg. 2026/2102) and the May 2026 simplification review had not happened yet. A Q1
    2026 edition should not reference a ''simplification review left the text intact'' outcome (unknown at the time) nor the
    July 2026 scope changes.'
  actions:
  - Confirm geolocation coverage per commodity × origin before 30 Dec 2026.
  - Map which suppliers and SKUs are hit by the 2027 scope additions.
  sources:
