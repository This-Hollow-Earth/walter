- id: conditions-cattle-deforestation
  name: Cattle-driven deforestation
  quadrant: conditions
  ring: adopt
  evidence: E4
  severity: high
  scope:
    commodities:
    - cattle
    issues:
    - forests-land
    origins:
      political:
      - Brazil
      - Paraguay
      ecological:
      - Amazon
      - Gran Chaco
    horizon:
    - now
  summary: Indirect cattle suppliers remain a documented traceability blind spot behind Amazon and Chaco deforestation.
  rationale: 'ADOPT/E4, unchanged, with a substituted second source. HRW''s Oct 2025 investigation remains the strongest evidence.
    2026-Q4''s Earthsight ''Grand Theft Chaco'' source is actually a September 2020 report — six years old — with no verifiable
    newer Chaco update found. Substituted Global Canopy''s Oct 2025 Trase explainer: deforestation linked to Brazilian cattle
    pasture rose from 5.5Mha (2020) to 7.5Mha (2023), >36% increase, Amazon''s share rising from 40% (2017) to 62% (2023)
    — arguably stronger, more current evidence for ADOPT.'
  actions:
  - Treat indirect cattle suppliers as a default risk category, not an exception, until individual traceability is mandatory
    (2032).
  - Extend monitoring into the Paraguayan/Bolivian Chaco, not only the Brazilian Amazon.
  sources:
  - title: Is your beef linked to Amazon deforestation? A report highlights loopholes
    url: https://www.aljazeera.com/news/2025/10/15/is-your-beef-linked-to-amazon-deforestation-a-report-highlights-loopholes
