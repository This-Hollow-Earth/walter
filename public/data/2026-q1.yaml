  summary: Major traders exited the Amazon Soy Moratorium in Jan 2026 while Cerrado soy-driven conversion keeps rising.
  rationale: 'ADOPT/E4, unchanged. This blip''s defining event happens right at the start of Q1 2026: Reuters confirmed 5
    January 2026 that Abiove members quit the Amazon Soy Moratorium; a 14 Jan 2026 follow-up shows ~2/3 of former signatories
    gone, no re-commitment. Trase''s 2020-2022 Cerrado conversion data (635,000ha to 794,000ha) supports the same ''already
    worsening'' framing as 2026-Q4.'
